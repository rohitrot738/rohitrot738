name: Build Android Debug APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8's Android project compiles with Java 21 (JDK 17 fails).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ubuntu-latest already includes the Android SDK; accept licenses so Gradle can fetch missing parts.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Loader self-test
        run: python3 test_loader.py

      - name: Safar tracker self-test
        run: node safar/test.cjs

      - name: Build railway database (timetable network)
        run: python3 loader_pipeline.py

      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: railways-db
          path: |
            indian_railways_complete.db
            rail_routes_full.json

      - name: Build web assets and sync Capacitor
        run: |
          ./scripts/build_www.sh
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
