name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: android-apk-publishing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8's Android project compiles with Java 21 (JDK 17 fails).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ubuntu-latest already includes the Android SDK; accept licenses so Gradle can fetch missing parts.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Loader self-test
        run: python3 test_loader.py

      - name: Safar tracker self-test
        run: node safar/test.cjs

      - name: Build railway database (timetable network)
        run: python3 loader_pipeline.py

      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: railways-db
          path: |
            indian_railways_complete.db
            rail_routes_full.json

      - name: Build web assets and sync Capacitor
        run: |
          ./scripts/build_www.sh
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The app itself, run on an emulator and checked from inside its page: that the page reaches the native side,
      # that the full-screen clock hides the phone's bars and fills the screen at any font size, and that a journey
      # goes on being recorded with the screen off. Done before a change is merged, on the debug build, whose page
      # can be driven. google_apis: the location service the app uses is Google's.
      - name: Enable KVM for the app test
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # For the small copies of the screenshots that the test prints to its log.
          sudo apt-get install -y -qq imagemagick || true

      - name: Test the app on an Android 14 emulator
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: node scripts/android_e2e.mjs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload app test screenshots
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: app-test-screenshots
          path: e2e-shots
          if-no-files-found: ignore

      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE" && -z "$PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "$KEYSTORE" || -z "$PASSWORD" ]]; then
            echo "::error::Signing configuration is incomplete; do not generate a replacement key."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed update APK
        if: steps.signing.outputs.enabled == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_NAME: build-${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          export APP_VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/suffer-sathi-signing.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload signed APK artifact
        if: steps.signing.outputs.enabled == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: suffer-sathi-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Check whether signed build is newer
        id: update-version
        if: steps.signing.outputs.enabled == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(gh release view suffer-sathi-updates --json body --jq .body)"
          current="$(printf '%s\n' "$body" | sed -n 's/^versionCode: \([0-9][0-9]*\)$/\1/p')"
          if [[ ! "$current" =~ ^[0-9]+$ ]]; then
            echo "::error::Existing update release has an invalid versionCode."
            exit 1
          fi
          if (( current >= 100000 + GITHUB_RUN_NUMBER )); then
            echo "newer=false" >> "$GITHUB_OUTPUT"
          else
            echo "newer=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable KVM for Android emulator
        if: steps.update-version.outputs.newer == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test signed upgrade and launch on Android 14
        if: steps.update-version.outputs.newer == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: bash scripts/android_update_smoke.sh

      - name: Publish update
        if: steps.update-version.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
          tag="suffer-sathi-updates"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --latest=false \
              --title "Suffer Sathi updates" --notes "versionCode: 0"
          fi
          body="$(gh release view "$tag" --json body --jq .body)"
          current="$(printf '%s\n' "$body" | sed -n 's/^versionCode: \([0-9][0-9]*\)$/\1/p')"
          if [[ ! "$current" =~ ^[0-9]+$ ]]; then
            echo "::error::Existing update release has an invalid versionCode."
            exit 1
          fi
          if (( current >= APP_VERSION_CODE )); then
            echo "This build is not newer than the published update; skipping."
            exit 0
          fi
          apk="Suffer-Sathi-${APP_VERSION_CODE}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$apk"
          gh release upload "$tag" "$RUNNER_TEMP/$apk" --clobber
          printf 'versionCode: %s\n\nDownload **%s** and confirm installation to update.\n' \
            "$APP_VERSION_CODE" "$apk" > "$RUNNER_TEMP/release-notes"
          gh release edit "$tag" --title "Suffer Sathi updates" --notes-file "$RUNNER_TEMP/release-notes" --latest=false
