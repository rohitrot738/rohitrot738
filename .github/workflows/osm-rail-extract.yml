name: OSM rail extract

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Test graph builder
        run: python3 -m unittest discover -s irsd/osm -p 'test_*.py' -v

      - name: Download India extract and verify checksum
        run: |
          curl --retry 3 -fL -o india-latest.osm.pbf https://download.geofabrik.de/asia/india-latest.osm.pbf
          curl --retry 3 -fL -o india-latest.osm.pbf.md5 https://download.geofabrik.de/asia/india-latest.osm.pbf.md5
          md5sum -c india-latest.osm.pbf.md5
          osmium fileinfo -e india-latest.osm.pbf > full-fileinfo.txt

      - name: Extract rail features with referenced nodes
        run: |
          osmium tags-filter india-latest.osm.pbf \
            w/railway=rail,light_rail,narrow_gauge,subway,tram,funicular,monorail,miniature,construction,disused,abandoned,proposed,preserved \
            nw/railway=station,halt \
            nw/public_transport=station \
            n/railway=junction,switch,crossing,level_crossing,buffer_stop,stop \
            n/public_transport=stop_position \
            r/route=train,railway,subway,tram \
            r/type=public_transport \
            -o india-rail.osm.pbf
          osmium check-refs india-rail.osm.pbf
          osmium fileinfo -e india-rail.osm.pbf > rail-fileinfo.txt
          sha256sum india-rail.osm.pbf > SHA256SUMS.txt

      - name: Build OSM track graph
        run: |
          python3 irsd/osm/build_graph.py india-rail.osm.pbf india-rail-graph.sqlite coverage.json \
            --independent-stations safar/stations.json \
            --independent-matches-output independent-station-candidates.csv \
            --match-summary station-match-summary.json \
            --station-routes-output station-route-candidates.json \
            --station-routes-summary station-route-summary.json \
            --osm-stations-output osm-stations.json
          TS=$(osmium fileinfo -g header.option.osmosis_replication_timestamp india-latest.osm.pbf)
          python3 - "$TS" <<'PY'
          import json, sys
          path = "station-route-summary.json"
          with open(path, encoding="utf-8") as f:
              summary = json.load(f)
          summary["osm_snapshot_timestamp"] = sys.argv[1]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(summary, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY
          sha256sum independent-station-candidates.csv station-match-summary.json osm-stations.json \
            station-route-candidates.json station-route-summary.json >> SHA256SUMS.txt
          gzip -9 india-rail-graph.sqlite
          sha256sum india-rail-graph.sqlite.gz >> SHA256SUMS.txt
          cp station-route-candidates.json safar/osm-station-routes.json
          cp station-route-summary.json safar/osm-station-route-summary.json
          cp osm-stations.json safar/osm-stations.json

      - name: Publish route data to Safar app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add safar/osm-station-routes.json safar/osm-station-route-summary.json safar/osm-stations.json
          if ! git diff --cached --quiet; then
            git commit -m "Update OSM track candidate routes for Safar"
            git push origin HEAD:main
          fi

      - name: Publish new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TS=$(osmium fileinfo -g header.option.osmosis_replication_timestamp india-latest.osm.pbf)
          TAG="osm-rail-${GITHUB_RUN_ID}"
          cat > NOTICE.txt <<EOF
          Contains data from OpenStreetMap, © OpenStreetMap contributors.
          Open Database License (ODbL): https://www.openstreetmap.org/copyright
          Source: https://download.geofabrik.de/asia/india-latest.osm.pbf
          Source replication timestamp: ${TS:-unknown}
          OSM-mapped topology is not independently verified; coverage is incomplete or unknown.
          See irsd/osm/README.md in the repository for methodology and limitations.
          EOF
          gh release edit osm-rail-20261107 --notes 'WARNING: This earlier extract omitted referenced track nodes (osmium tags-filter -R); it cannot be used to construct a complete track graph. Use a newer release produced by the corrected workflow. Contains OpenStreetMap data © OpenStreetMap contributors, ODbL 1.0; coverage not verified.'
          gh release create "$TAG" india-rail.osm.pbf india-rail-graph.sqlite.gz \
            independent-station-candidates.csv station-match-summary.json \
            station-route-candidates.json station-route-summary.json osm-stations.json \
            full-fileinfo.txt rail-fileinfo.txt coverage.json SHA256SUMS.txt NOTICE.txt \
            --title "OSM rail graph $TAG" \
            --notes "OSM-derived physical track graph and unreviewed candidates against the separate DataMeet-derived Safar station catalog. No WIMT/IRSD data included. Coverage and real-world connectivity are not independently verified. © OpenStreetMap contributors, ODbL 1.0. See irsd/osm/README.md."
